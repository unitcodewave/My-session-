<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SILENTBYTE FORCE SESSION ID</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary-color: #000000;
      --secondary-color: #ffffff;
      --accent-color: #f0f0f0;
      --text-color: #000000;
      --background-color: #ffffff;
      --hover-color: #f5f5f5;
      --border-color: rgba(0, 0, 0, 0.1);
      --success-color: #000aff;
      --error-color: #e74c3c;
      --card-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --primary-color: #ffffff;
      --secondary-color: #121212;
      --accent-color: #1e1e1e;
      --text-color: #ffffff;
      --background-color: #121212;
      --hover-color: #2a2a2a;
      --border-color: rgba(255, 255, 255, 0.1);
      --success-color: #4d7cfe;
      --error-color: #ff6b6b;
      --card-bg: #1e1e1e;
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      transition: all 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px var(--shadow-color);
      border: 1px solid var(--border-color);
      transition: all 0.4s ease;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--hover-color);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: rotate(15deg);
      background: var(--accent-color);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-color), #333333);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      box-shadow: 0 4px 15px var(--shadow-color);
      transition: all 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--primary-color);
      background: linear-gradient(135deg, var(--primary-color), #555555);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.3s ease;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-color);
      opacity: 0.7;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .developer {
      font-size: 12px;
      color: var(--text-color);
      opacity: 0.6;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-icons a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .social-icons a.youtube { background: #FF0000; }
    .social-icons a.telegram { background: #0088cc; }
    .social-icons a.whatsapp { background: #0cfa10; }
    .social-icons a.github { background: #333; }

    .social-icons a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    /* Toggle Switch Styles */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      background: var(--hover-color);
      border-radius: 14px;
      padding: 4px;
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .toggle-option {
      flex: 1;
      padding: 12px 16px;
      text-align: center;
      cursor: pointer;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .toggle-option.active {
      background: var(--primary-color);
      color: var(--secondary-color);
    }

    .toggle-option:not(.active) {
      color: var(--text-color);
    }

    .toggle-option:hover:not(.active) {
      background: var(--accent-color);
    }

    .copy-btn {
      width: 100%;
      padding: 14px;
      background: var(--hover-color);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      color: var(--text-color);
    }

    .copy-btn:hover {
      background: var(--accent-color);
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    .input-group {
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .input-group.hidden {
      display: none;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-color);
      transition: all 0.3s ease;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      background: var(--background-color);
      color: var(--text-color);
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color), #333333);
      border: none;
      border-radius: 14px;
      color: var(--secondary-color);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--shadow-color);
    }

    .generate-btn.hidden {
      display: none;
    }

    .code-display {
      background: var(--hover-color);
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .qr-display {
      background: var(--hover-color);
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 16px;
      border: 1.5px solid var(--border-color);
      display: none;
      transition: all 0.3s ease;
    }

    .qr-image {
      max-width: 280px;
      max-height: 280px;
      margin: 0 auto 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px var(--shadow-color);
      transition: all 0.3s ease;
    }

    .qr-instructions {
      font-size: 13px;
      color: var(--text-color);
      opacity: 0.7;
      line-height: 1.5;
      transition: all 0.3s ease;
    }

    .success-message {
      color: var(--success-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .error-message {
      color: var(--error-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
    }

    .loading i {
      font-size: 24px;
      color: var(--primary-color);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-color);
      opacity: 0.5;
      transition: all 0.3s ease;
    }

    /* Smooth transitions for all interactive elements */
    button, a, .toggle-option, .input-field, .logo, .social-icons a {
      transition: all 0.3s ease;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
        border-radius: 16px;
        max-width: 400px;
      }

      .code-display {
        font-size: 16px;
        min-height: 50px;
      }

      .qr-image {
        max-width: 240px;
        max-height: 240px;
      }

      .qr-display {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
      </div>
      <div class="logo"><i class="fas fa-shield-alt"></i></div>
      <h1 class="title">SILENTBYTE FORCE SESSION ID</h1>
      <p class="subtitle">Link your WhatsApp device securely</p>
      <p class="developer">developed by iconic tech</p>
      <div class="social-icons">
        <a href="https://www.youtube.com/@iconictechdev" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
        <a href="#" target="_blank" class="telegram"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://whatsapp.com/channel/0029ValX2Js9RZAVtDgMYj0r" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://github.com/iconictech-dev" target="_blank" class="github"><i class="fab fa-github"></i></a>
      </div>
    </div>

    <!-- Toggle Switch -->
    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">
        <i class="fas fa-key"></i> Pair Code
      </div>
      <div class="toggle-option" data-mode="qr">
        <i class="fas fa-qrcode"></i> QR Code
      </div>
    </div>

    <div class="input-group" id="inputGroup">
      <label class="input-label">Enter your WhatsApp number with country code</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="+917023951514" pattern="[+][0-9]{10,}" title="Please enter country code starting with + followed by number">
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-key"></i> Generate Pair Code
    </button>

    <div class="loading" id="loading">
      <i class="fas fa-spinner"></i>
    </div>

    <div class="code-display" id="codeDisplay">
      Your pair code will appear here
    </div>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code">
      <div class="qr-instructions" id="qrInstructions">
        Scan this QR code with your WhatsApp app
      </div>
    </div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      <i class="fas fa-copy"></i> Copy Code
    </button>

    <div class="footer">
      <p>© 2025 iconic tech | SILENTBYTE FORCE SESSION ID</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let currentMode = 'pair';
    let currentTheme = 'light';

    // Theme toggle functionality
    document.getElementById('themeToggle').addEventListener('click', function() {
      if (currentTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'dark');
        this.innerHTML = '<i class="fas fa-sun"></i>';
        currentTheme = 'dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        this.innerHTML = '<i class="fas fa-moon"></i>';
        currentTheme = 'light';
      }
    });

    // Toggle functionality
    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode === currentMode) return;

        // Update active state
        document.querySelectorAll('.toggle-option').forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');

        // Update mode
        currentMode = mode;

        // Update button and input visibility
        const submitBtn = document.getElementById('submit');
        const inputGroup = document.getElementById('inputGroup');
        
        if (mode === 'pair') {
          submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
          submitBtn.classList.remove('hidden');
          inputGroup.classList.remove('hidden');
        } else {
          submitBtn.classList.add('hidden');
          inputGroup.classList.add('hidden');
          // Auto-generate QR code when QR mode is selected
          generateQRCode();
        }

        // Clear displays
        document.getElementById('codeDisplay').innerHTML = 'Your pair code will appear here';
        document.getElementById('qrDisplay').style.display = 'none';
        document.getElementById('codeDisplay').style.display = 'flex';
      });
    });

    async function generateQRCode() {
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios('/qr');
        
        if (response.data.qr) {
          document.getElementById('qrImage').src = response.data.qr;
          document.getElementById('qrInstructions').innerHTML = response.data.instructions.join('<br>');
          qrDisplay.style.display = 'block';
          codeDisplay.style.display = 'none';
          
          // Show success message with SweetAlert2
          Swal.fire({
            title: 'QR Code Generated!',
            text: 'Scan the QR code with your WhatsApp app',
            icon: 'success',
            confirmButtonText: 'OK',
            background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
          });
        } else {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Failed to generate QR code</div>';
          codeDisplay.style.display = 'flex';
          
          // Show error message with SweetAlert2
          Swal.fire({
            title: 'Error!',
            text: 'Failed to generate QR code',
            icon: 'error',
            confirmButtonText: 'Try Again',
            background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
          });
        }
      } catch (error) {
        console.error("Error generating QR code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating QR code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
        
        // Show error message with SweetAlert2
        Swal.fire({
          title: 'Connection Error!',
          text: 'Error generating QR code. Please try again.',
          icon: 'error',
          confirmButtonText: 'OK',
          background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
        });
      } finally {
        loadingSpinner.style.display = "none";
      }
    }

    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      
      const mobileNumberInput = document.getElementById("mobileNumber");
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      const mobileNumber = mobileNumberInput.value.trim();
      if (!mobileNumber) {
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
        
        // Show error message with SweetAlert2
        Swal.fire({
          title: 'Missing Information!',
          text: 'Please enter your WhatsApp number',
          icon: 'warning',
          confirmButtonText: 'OK',
          background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
        });
        return;
      }

      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios(`/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`);
        
        const code = response.data.code || "Service Unavailable";
        if (code === "Service Unavailable") {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Service Unavailable</div>';
          
          // Show error message with SweetAlert2
          Swal.fire({
            title: 'Service Unavailable!',
            text: 'Please try again later',
            icon: 'error',
            confirmButtonText: 'OK',
            background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
          });
        } else {
          codeDisplay.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i> CODE: ${code}</div>`;
          
          // Show success message with SweetAlert2
          Swal.fire({
            title: 'Code Generated!',
            text: 'Your pair code has been generated successfully',
            icon: 'success',
            confirmButtonText: 'OK',
            background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
          });
        }
        codeDisplay.style.display = 'flex';
      } catch (error) {
        console.error("Error generating code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
        
        // Show error message with SweetAlert2
        Swal.fire({
          title: 'Error!',
          text: 'Error generating code. Please try again.',
          icon: 'error',
          confirmButtonText: 'OK',
          background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
        });
      } finally {
        loadingSpinner.style.display = "none";
      }
    });
    
    function copyCode() {
      const codeDisplay = document.getElementById("codeDisplay").innerText;
      const code = codeDisplay.replace('CODE: ', '');
      
      if (code === 'Your pair code will appear here' || code.includes('Error') || code.includes('Service Unavailable')) {
        // Show warning message with SweetAlert2
        Swal.fire({
          title: 'No Code to Copy!',
          text: 'Please generate a code first',
          icon: 'warning',
          confirmButtonText: 'OK',
          background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
        });
        return;
      }
      
      navigator.clipboard.writeText(code).then(() => {
        const copyBtn = document.getElementById("copy");
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        
        // Show success message with SweetAlert2
        Swal.fire({
          title: 'Copied!',
          text: 'Code copied to clipboard',
          icon: 'success',
          timer: 1500,
          showConfirmButton: false,
          background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
        });
        
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 2000);
      }).catch(err => {
        console.error("Failed to copy text: ", err);
        
        // Show error message with SweetAlert2
        Swal.fire({
          title: 'Copy Failed!',
          text: 'Failed to copy code to clipboard',
          icon: 'error',
          confirmButtonText: 'OK',
          background: getComputedStyle(document.documentElement).getPropertyValue('--card-bg'),
          color: getComputedStyle(document.documentElement).getPropertyValue('--text-color')
        });
      });
    }
  </script>
</body>
</html>
