<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SILENTBYTE FORCE SESSION ID</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #3b82f6;
      --accent-color: #60a5fa;
      --text-color: #ffffff;
      --background-color: #0f172a;
      --card-bg: #1e293b;
      --hover-color: #334155;
      --border-color: #334155;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      position: relative;
      overflow: hidden;
    }

    .logo::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
      top: 0;
      left: 0;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .dev-info {
      font-size: 12px;
      color: #64748b;
      margin-top: 5px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-icons a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .social-icons a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .social-icons a.whatsapp { 
      background: linear-gradient(135deg, #25D366, #128C7E); 
    }
    .social-icons a.tiktok { 
      background: linear-gradient(135deg, #000000, #69C9D0, #EE1D52); 
    }

    .social-icons a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .social-icons a:hover::after {
      opacity: 1;
    }

    /* Toggle Switch Styles */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      background: var(--background-color);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    .toggle-option {
      flex: 1;
      padding: 12px 16px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .toggle-option.active {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: var(--text-color);
    }

    .toggle-option:not(.active) {
      color: #94a3b8;
    }

    .toggle-option:hover:not(.active) {
      background: var(--hover-color);
    }

    .color-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .color-option {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .color-option.active {
      border-color: white;
      transform: scale(1.1);
    }

    .color-option:hover {
      transform: scale(1.1);
    }

    .input-group {
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .input-group.hidden {
      display: none;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 13px;
      color: #cbd5e1;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      background: var(--background-color);
      color: var(--text-color);
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border: none;
      border-radius: 12px;
      color: var(--text-color);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .generate-btn::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
    }

    .generate-btn:hover::after {
      opacity: 1;
    }

    .generate-btn.hidden {
      display: none;
    }

    .code-display {
      background: var(--background-color);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .qr-display {
      background: var(--background-color);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 16px;
      border: 1.5px solid var(--border-color);
      display: none;
    }

    .qr-image {
      max-width: 280px;
      max-height: 280px;
      margin: 0 auto 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .qr-instructions {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .success-message {
      color: var(--success-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
    }

    .error-message {
      color: var(--error-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
    }

    .loading i {
      font-size: 24px;
      color: var(--secondary-color);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .copy-btn {
      width: 100%;
      padding: 14px;
      background: var(--background-color);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-color);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .copy-btn::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .copy-btn:hover {
      background: var(--hover-color);
      border-color: var(--secondary-color);
    }

    .copy-btn:hover::after {
      opacity: 1;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
        border-radius: 16px;
        max-width: 400px;
      }

      .code-display {
        font-size: 16px;
        min-height: 50px;
      }

      .qr-image {
        max-width: 240px;
        max-height: 240px;
      }

      .qr-display {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="fas fa-shield-alt"></i></div>
      <h1 class="title">SILENTBYTE FORCE SESSION ID</h1>
      <p class="subtitle">Link your WhatsApp device</p>
      <p class="dev-info">dev by iconic tech</p>
      <div class="social-icons">
        <a href="https://whatsapp.com/channel/0029ValX2Js9RZAVtDgMYj0r" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://tiktok.com/@iconic.tech.dev" target="_blank" class="tiktok"><i class="fab fa-tiktok"></i></a>
      </div>
    </div>

    <!-- Color Picker -->
    <div class="color-picker">
      <div class="color-option active" style="background: #1e3a8a;" data-color="blue"></div>
      <div class="color-option" style="background: #7e22ce;" data-color="purple"></div>
      <div class="color-option" style="background: #dc2626;" data-color="red"></div>
      <div class="color-option" style="background: #059669;" data-color="green"></div>
      <div class="color-option" style="background: #ea580c;" data-color="orange"></div>
    </div>

    <!-- Toggle Switch -->
    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">
        <i class="fas fa-key"></i> Pair Code
      </div>
      <div class="toggle-option" data-mode="qr">
        <i class="fas fa-qrcode"></i> QR Code
      </div>
    </div>

    <div class="input-group" id="inputGroup">
      <label class="input-label">Enter your WhatsApp number with country code</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="+263783525824" pattern="[+][0-9]{10,}" title="Please enter country code starting with + followed by number">
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-key"></i> Generate Pair Code
    </button>

    <div class="loading" id="loading">
      <i class="fas fa-spinner"></i>
    </div>

    <div class="code-display" id="codeDisplay">
      Your pair code will appear here
    </div>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code">
      <div class="qr-instructions" id="qrInstructions">
        Scan this QR code with your WhatsApp app
      </div>
    </div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      <i class="fas fa-copy"></i> Copy Code
    </button>

    <div class="footer">
      <p>© 2025 iconic tech | SILENTBYTE FORCE SESSION ID</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    // Color theme functionality
    const colorOptions = document.querySelectorAll('.color-option');
    colorOptions.forEach(option => {
      option.addEventListener('click', function() {
        colorOptions.forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');
        
        const color = this.dataset.color;
        changeColorTheme(color);
      });
    });

    function changeColorTheme(color) {
      const root = document.documentElement;
      
      switch(color) {
        case 'blue':
          root.style.setProperty('--primary-color', '#1e3a8a');
          root.style.setProperty('--secondary-color', '#3b82f6');
          root.style.setProperty('--accent-color', '#60a5fa');
          break;
        case 'purple':
          root.style.setProperty('--primary-color', '#7e22ce');
          root.style.setProperty('--secondary-color', '#a855f7');
          root.style.setProperty('--accent-color', '#c084fc');
          break;
        case 'red':
          root.style.setProperty('--primary-color', '#dc2626');
          root.style.setProperty('--secondary-color', '#ef4444');
          root.style.setProperty('--accent-color', '#f87171');
          break;
        case 'green':
          root.style.setProperty('--primary-color', '#059669');
          root.style.setProperty('--secondary-color', '#10b981');
          root.style.setProperty('--accent-color', '#34d399');
          break;
        case 'orange':
          root.style.setProperty('--primary-color', '#ea580c');
          root.style.setProperty('--secondary-color', '#f97316');
          root.style.setProperty('--accent-color', '#fb923c');
          break;
      }
      
      // Show notification
      Swal.fire({
        title: 'Theme Changed!',
        text: `Switched to ${color} theme`,
        icon: 'success',
        timer: 1500,
        showConfirmButton: false,
        toast: true,
        position: 'top-end'
      });
    }

    let currentMode = 'pair';

    // Toggle functionality
    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode === currentMode) return;

        // Update active state
        document.querySelectorAll('.toggle-option').forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');

        // Update mode
        currentMode = mode;

        // Update button and input visibility
        const submitBtn = document.getElementById('submit');
        const inputGroup = document.getElementById('inputGroup');
        
        if (mode === 'pair') {
          submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
          submitBtn.classList.remove('hidden');
          inputGroup.classList.remove('hidden');
          
          // Show notification
          Swal.fire({
            title: 'Pair Code Mode',
            text: 'Enter your number to generate a pair code',
            icon: 'info',
            timer: 1500,
            showConfirmButton: false,
            toast: true,
            position: 'top-end'
          });
        } else {
          submitBtn.classList.add('hidden');
          inputGroup.classList.add('hidden');
          // Auto-generate QR code when QR mode is selected
          generateQRCode();
          
          // Show notification
          Swal.fire({
            title: 'QR Code Mode',
            text: 'QR code will be generated automatically',
            icon: 'info',
            timer: 1500,
            showConfirmButton: false,
            toast: true,
            position: 'top-end'
          });
        }

        // Clear displays
        document.getElementById('codeDisplay').innerHTML = 'Your pair code will appear here';
        document.getElementById('qrDisplay').style.display = 'none';
        document.getElementById('codeDisplay').style.display = 'flex';
      });
    });

    async function generateQRCode() {
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios('/qr');
        
        if (response.data.qr) {
          document.getElementById('qrImage').src = response.data.qr;
          document.getElementById('qrInstructions').innerHTML = response.data.instructions.join('<br>');
          qrDisplay.style.display = 'block';
          codeDisplay.style.display = 'none';
          
          // Show success notification
          Swal.fire({
            title: 'QR Code Generated!',
            text: 'Scan the QR code with your WhatsApp app',
            icon: 'success',
            timer: 2000,
            showConfirmButton: false,
            toast: true,
            position: 'top-end'
          });
        } else {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Failed to generate QR code</div>';
          codeDisplay.style.display = 'flex';
          
          // Show error notification
          Swal.fire({
            title: 'Error!',
            text: 'Failed to generate QR code',
            icon: 'error',
            timer: 2000,
            showConfirmButton: false,
            toast: true,
            position: 'top-end'
          });
        }
      } catch (error) {
        console.error("Error generating QR code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating QR code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
        
        // Show error notification
        Swal.fire({
          title: 'Error!',
          text: 'Error generating QR code. Please try again.',
          icon: 'error',
          timer: 2000,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
      } finally {
        loadingSpinner.style.display = "none";
      }
    }

    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      
      const mobileNumberInput = document.getElementById("mobileNumber");
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      const mobileNumber = mobileNumberInput.value.trim();
      if (!mobileNumber) {
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
        
        // Show error notification
        Swal.fire({
          title: 'Error!',
          text: 'Please enter your WhatsApp number',
          icon: 'error',
          timer: 2000,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
        return;
      }

      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios(`/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`);
        
        const code = response.data.code || "Service Unavailable";
        if (code === "Service Unavailable") {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Service Unavailable</div>';
          
          // Show error notification
          Swal.fire({
            title: 'Service Unavailable!',
            text: 'Please try again later',
            icon: 'error',
            timer: 2000,
            showConfirmButton: false,
            toast: true,
            position: 'top-end'
          });
        } else {
          codeDisplay.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i> CODE: ${code}</div>`;
          
          // Show success notification
          Swal.fire({
            title: 'Pair Code Generated!',
            text: 'Your pair code has been generated successfully',
            icon: 'success',
            timer: 2000,
            showConfirmButton: false,
            toast: true,
            position: 'top-end'
          });
        }
        codeDisplay.style.display = 'flex';
      } catch (error) {
        console.error("Error generating code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
        
        // Show error notification
        Swal.fire({
          title: 'Error!',
          text: 'Error generating code. Please try again.',
          icon: 'error',
          timer: 2000,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
      } finally {
        loadingSpinner.style.display = "none";
      }
    });
    
    function copyCode() {
      const codeDisplay = document.getElementById("codeDisplay").innerText;
      const code = codeDisplay.replace('CODE: ', '');
      
      if (code === 'Your pair code will appear here' || code.includes('Error') || code.includes('Service Unavailable')) {
        // Show error notification
        Swal.fire({
          title: 'Nothing to Copy!',
          text: 'Generate a code first',
          icon: 'warning',
          timer: 2000,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
        return;
      }
      
      navigator.clipboard.writeText(code).then(() => {
        const copyBtn = document.getElementById("copy");
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        
        // Show success notification
        Swal.fire({
          title: 'Copied!',
          text: 'Code copied to clipboard',
          icon: 'success',
          timer: 2000,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
        
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 2000);
      }).catch(err => {
        console.error("Failed to copy text: ", err);
        
        // Show error notification
        Swal.fire({
          title: 'Copy Failed!',
          text: 'Failed to copy code to clipboard',
          icon: 'error',
          timer: 2000,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
      });
    }
    
    // Initial notification
    document.addEventListener('DOMContentLoaded', function() {
      Swal.fire({
        title: 'Welcome to SILENTBYTE FORCE SESSION ID',
        text: 'Generate WhatsApp session IDs easily',
        icon: 'info',
        timer: 2000,
        showConfirmButton: false,
        toast: true,
        position: 'top-end'
      });
    });
  </script>
</body>
</html>
