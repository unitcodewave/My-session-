<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SILENTBYTE FORCE SESSION ID - WhatsApp Linker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary-color: #6a11cb;
      --secondary-color: #2575fc;
      --accent-color: #f0f0f0;
      --text-color: #333333;
      --background-color: #ffffff;
      --card-bg: #ffffff;
      --hover-color: #f5f5f5;
      --border-color: rgba(0, 0, 0, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    [data-theme="dark"] {
      --primary-color: #8a2be2;
      --secondary-color: #4169e1;
      --text-color: #f0f0f0;
      --background-color: #121212;
      --card-bg: #1e1e1e;
      --hover-color: #2a2a2a;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--background-color) 0%, var(--hover-color) 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      transition: var(--transition);
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: var(--transition);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--hover-color);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      width: 50px;
      height: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 5px;
      transition: var(--transition);
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--primary-color);
      transition: var(--transition);
      transform: translateX(0);
    }

    [data-theme="dark"] .theme-toggle::before {
      transform: translateX(25px);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
      transition: var(--transition);
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: var(--transition);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-color);
      opacity: 0.7;
      margin-bottom: 20px;
      transition: var(--transition);
    }

    .developer {
      font-size: 12px;
      color: var(--text-color);
      opacity: 0.6;
      margin-bottom: 15px;
      transition: var(--transition);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-icons a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .social-icons a.youtube { background: #FF0000; }
    .social-icons a.telegram { background: #0088cc; }
    .social-icons a.whatsapp { background: #25D366; }
    .social-icons a.github { background: #333; }

    .social-icons a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    /* Toggle Switch Styles */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      background: var(--hover-color);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .toggle-option {
      flex: 1;
      padding: 10px 16px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: var(--transition);
      position: relative;
    }

    .toggle-option.active {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      box-shadow: 0 2px 8px rgba(106, 17, 203, 0.3);
    }

    .toggle-option:not(.active) {
      color: var(--text-color);
    }

    .toggle-option:hover:not(.active) {
      background: var(--card-bg);
    }

    .input-group {
      margin-bottom: 20px;
      transition: var(--transition);
    }

    .input-group.hidden {
      display: none;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 13px;
      transition: var(--transition);
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 15px;
      transition: var(--transition);
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(106, 17, 203, 0.2);
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(106, 17, 203, 0.3);
    }

    .generate-btn.hidden {
      display: none;
    }

    .code-display {
      background: var(--hover-color);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-color);
      transition: var(--transition);
    }

    .qr-display {
      background: var(--hover-color);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 16px;
      border: 1.5px solid var(--border-color);
      display: none;
      transition: var(--transition);
    }

    .qr-image {
      max-width: 280px;
      max-height: 280px;
      margin: 0 auto 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transition: var(--transition);
    }

    .qr-instructions {
      font-size: 13px;
      color: var(--text-color);
      opacity: 0.7;
      line-height: 1.5;
      transition: var(--transition);
    }

    .success-message {
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      transition: var(--transition);
    }

    .error-message {
      color: #e74c3c;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
    }

    .loading i {
      font-size: 24px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .copy-btn {
      width: 100%;
      padding: 14px;
      background: var(--hover-color);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      color: var(--text-color);
    }

    .copy-btn:hover {
      background: var(--card-bg);
      border-color: var(--primary-color);
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-color);
      opacity: 0.6;
      transition: var(--transition);
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
        border-radius: 16px;
        max-width: 400px;
      }

      .code-display {
        font-size: 16px;
        min-height: 50px;
      }

      .qr-image {
        max-width: 240px;
        max-height: 240px;
      }

      .qr-display {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="theme-toggle" id="themeToggle"></div>
      <div class="logo">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h1 class="title">SILENTBYTE FORCE SESSION ID</h1>
      <p class="subtitle">Link your WhatsApp device securely</p>
      <p class="developer">Developed by Iconic Tech</p>
      <div class="social-icons">
        <a href="https://www.youtube.com/@iconictechdev" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
        <a href="#" target="_blank" class="telegram"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://whatsapp.com/channel/0029ValX2Js9RZAVtDgMYj0r" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://github.com/iconictech-dev" target="_blank" class="github"><i class="fab fa-github"></i></a>
      </div>
    </div>

    <!-- Toggle Switch -->
    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">
        <i class="fas fa-key"></i> Pair Code
      </div>
      <div class="toggle-option" data-mode="qr">
        <i class="fas fa-qrcode"></i> QR Code
      </div>
    </div>

    <div class="input-group" id="inputGroup">
      <label class="input-label">Enter your WhatsApp number with country code</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="+263714388643" pattern="[+][0-9]{10,}" title="Please enter country code starting with + followed by number">
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-key"></i> Generate Pair Code
    </button>

    <div class="loading" id="loading">
      <i class="fas fa-spinner"></i>
    </div>

    <div class="code-display" id="codeDisplay">
      Your pair code will appear here
    </div>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code">
      <div class="qr-instructions" id="qrInstructions">
        Scan this QR code with your WhatsApp app
      </div>
    </div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      <i class="fas fa-copy"></i> Copy Code
    </button>

    <div class="footer">
      <p>© 2025 Iconic Tech | SILENTBYTE FORCE SESSION ID</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    
    // Check for saved theme or use preferred color scheme
    const currentTheme = localStorage.getItem('theme') || (prefersDarkScheme.matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', currentTheme);
    
    themeToggle.addEventListener('click', function() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      // Show theme change notification
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'success',
        title: `Switched to ${newTheme} mode`,
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true
      });
    });

    let currentMode = 'pair';

    // Toggle functionality
    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode === currentMode) return;

        // Update active state
        document.querySelectorAll('.toggle-option').forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');

        // Update mode
        currentMode = mode;

        // Update button and input visibility
        const submitBtn = document.getElementById('submit');
        const inputGroup = document.getElementById('inputGroup');
        
        if (mode === 'pair') {
          submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
          submitBtn.classList.remove('hidden');
          inputGroup.classList.remove('hidden');
        } else {
          submitBtn.classList.add('hidden');
          inputGroup.classList.add('hidden');
          // Auto-generate QR code when QR mode is selected
          generateQRCode();
        }

        // Clear displays
        document.getElementById('codeDisplay').innerHTML = 'Your pair code will appear here';
        document.getElementById('qrDisplay').style.display = 'none';
        document.getElementById('codeDisplay').style.display = 'flex';
      });
    });

    async function generateQRCode() {
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios('/qr');
        
        if (response.data.qr) {
          document.getElementById('qrImage').src = response.data.qr;
          document.getElementById('qrInstructions').innerHTML = response.data.instructions.join('<br>');
          qrDisplay.style.display = 'block';
          codeDisplay.style.display = 'none';
          
          // Show success notification
          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: 'QR Code generated successfully',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
          });
        } else {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Failed to generate QR code</div>';
          codeDisplay.style.display = 'flex';
          
          // Show error notification
          Swal.fire({
            icon: 'error',
            title: 'QR Generation Failed',
            text: 'Failed to generate QR code. Please try again.',
            confirmButtonColor: '#6a11cb'
          });
        }
      } catch (error) {
        console.error("Error generating QR code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating QR code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
        
        // Show error notification
        Swal.fire({
          icon: 'error',
          title: 'Connection Error',
          text: 'Error generating QR code. Please check your connection and try again.',
          confirmButtonColor: '#6a11cb'
        });
      } finally {
        loadingSpinner.style.display = "none";
      }
    }

    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      
      const mobileNumberInput = document.getElementById("mobileNumber");
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loadingSpinner = document.getElementById("loading");

      const mobileNumber = mobileNumberInput.value.trim();
      if (!mobileNumber) {
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
        
        // Show error notification
        Swal.fire({
          icon: 'warning',
          title: 'Missing Information',
          text: 'Please enter your WhatsApp number with country code.',
          confirmButtonColor: '#6a11cb'
        });
        return;
      }

      // Validate phone number format
      const phoneRegex = /^\+[1-9]\d{1,14}$/;
      if (!phoneRegex.test(mobileNumber)) {
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter a valid phone number with country code</div>';
        
        // Show error notification
        Swal.fire({
          icon: 'warning',
          title: 'Invalid Format',
          text: 'Please enter a valid phone number starting with + followed by country code and number.',
          confirmButtonColor: '#6a11cb'
        });
        return;
      }

      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios(`/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`);
        
        const code = response.data.code || "Service Unavailable";
        if (code === "Service Unavailable") {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Service Unavailable</div>';
          
          // Show error notification
          Swal.fire({
            icon: 'error',
            title: 'Service Unavailable',
            text: 'The pairing service is currently unavailable. Please try again later.',
            confirmButtonColor: '#6a11cb'
          });
        } else {
          codeDisplay.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i> CODE: ${code}</div>`;
          
          // Show success notification
          Swal.fire({
            icon: 'success',
            title: 'Pair Code Generated',
            html: `Your pair code is: <strong>${code}</strong><br><br>Click the "Copy Code" button to copy it.`,
            confirmButtonColor: '#6a11cb'
          });
        }
        codeDisplay.style.display = 'flex';
      } catch (error) {
        console.error("Error generating code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
        
        // Show error notification
        Swal.fire({
          icon: 'error',
          title: 'Connection Error',
          text: 'Error generating pair code. Please check your connection and try again.',
          confirmButtonColor: '#6a11cb'
        });
      } finally {
        loadingSpinner.style.display = "none";
      }
    });

    function copyCode() {
      const codeDisplay = document.getElementById("codeDisplay").innerText;
      const code = codeDisplay.replace('CODE: ', '');
      
      // Check if we have a valid code to copy
      if (!code || code === "Your pair code will appear here" || code.includes("Error") || code.includes("Service Unavailable")) {
        Swal.fire({
          icon: 'warning',
          title: 'Nothing to Copy',
          text: 'Please generate a code first before copying.',
          confirmButtonColor: '#6a11cb'
        });
        return;
      }
      
      navigator.clipboard.writeText(code).then(() => {
        const copyBtn = document.getElementById("copy");
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        
        // Show success notification
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: 'Code copied to clipboard',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true
        });
        
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 2000);
      }).catch(err => {
        console.error("Failed to copy text: ", err);
        Swal.fire({
          icon: 'error',
          title: 'Copy Failed',
          text: 'Failed to copy code to clipboard. Please try again.',
          confirmButtonColor: '#6a11cb'
        });
      });
    }
  </script>
</body>
</html>
